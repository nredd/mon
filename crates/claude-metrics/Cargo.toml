[package]
name = "claude-metrics"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
description = "Reads live Claude Code session, token, agent, and cost metrics off the local `~/.claude` tree."
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

# NOTE(redd): pedantic is scoped to this crate on purpose. The gate runs plain
# `-D warnings` workspace-wide because upstream bottom is not pedantic-clean and
# never claimed to be -- but code I write here clears the higher bar.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
